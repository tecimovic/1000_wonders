<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apps</title>
    <script>
      // If the server handed us this page for /lg, /lg/..., /train or /train/...
      // (e.g. no trailing slash, or a 404 fallback), forward to that app.
      (function () {
        var apps = ['lg', 'train'];
        var first = location.pathname.split('/')[1];
        if (apps.indexOf(first) !== -1) {
          location.replace('/' + first + '/' + location.search + location.hash);
        }
      })();
    </script>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background:
          radial-gradient(ellipse at 20% 10%, #1b1640 0%, transparent 55%),
          radial-gradient(ellipse at 85% 90%, #0f2a33 0%, transparent 50%),
          #08080f;
        color: #e8e8f0;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      main { width: 100%; max-width: 480px; }
      h1 { font-weight: 650; letter-spacing: -0.02em; margin: 0 0 24px; }
      ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
      a {
        display: block;
        padding: 18px 20px;
        border: 1px solid #262640;
        border-radius: 12px;
        background: #0e0e1c;
        color: inherit;
        text-decoration: none;
        transition: border-color .15s, background .15s, transform .15s;
      }
      a:hover { border-color: #7a5cff; background: #14142a; transform: translateY(-1px); }
      a strong { font-size: 18px; }
      a span { display: block; font-size: 14px; color: #9a9ab0; margin-top: 4px; }
      code { color: #7a7a95; font-size: 13px; float: right; }
    </style>
  </head>
  <body>
    <main>
      <h1>Apps</h1>
      <ul>
        <li><a href="/lg/"><code>/lg</code><strong>World of 1000 Wonders</strong><span>Minecraft world map</span></a></li>
        <li><a href="/train/"><code>/train</code><strong>Public transportation</strong><span>Yay, public transportation!</span></a></li>
      </ul>
    </main>
  </body>
</html>
